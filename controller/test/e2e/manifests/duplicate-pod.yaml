apiVersion: control.benchhandoff.dev/v1alpha1
kind: AgentRun
metadata:
  name: duplicate-pod
  namespace: benchhandoff-e2e
  labels:
    test.benchhandoff.dev/case: duplicate-pod
spec:
  execution:
    pvcName: benchhandoff-e2e-data
