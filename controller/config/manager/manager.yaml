apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentrun-controller
  namespace: benchhandoff-system
  labels:
    app.kubernetes.io/name: agentrun-controller
    app.kubernetes.io/part-of: benchhandoff
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agentrun-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentrun-controller
        app.kubernetes.io/part-of: benchhandoff
    spec:
      serviceAccountName: agentrun-controller
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: benchhandoff-agentrun-controller:e2e
          imagePullPolicy: IfNotPresent
          command:
            - /manager
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 10
