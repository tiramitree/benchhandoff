apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentruns.control.benchhandoff.dev
spec:
  group: control.benchhandoff.dev
  names:
    kind: AgentRun
    listKind: AgentRunList
    plural: agentruns
    singular: agentrun
    shortNames:
      - arun
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Action
          type: string
          jsonPath: .status.activeJobRef.action
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          x-kubernetes-validations:
            - rule: "!has(self.spec.resumeDecisionSHA256) || has(oldSelf.spec.resumeDecisionSHA256) || (has(oldSelf.status) && has(oldSelf.status.phase) && oldSelf.status.phase == 'AwaitingApproval' && has(oldSelf.status.resumeDecisionSHA256) && self.spec.resumeDecisionSHA256 == oldSelf.status.resumeDecisionSHA256)"
              message: resumeDecisionSHA256 may first be set only to the decision published in AwaitingApproval
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - execution
              x-kubernetes-validations:
                - rule: "!has(oldSelf.resumeDecisionSHA256) || (has(self.resumeDecisionSHA256) && self.resumeDecisionSHA256 == oldSelf.resumeDecisionSHA256)"
                  message: resumeDecisionSHA256 is write-once
              properties:
                execution:
                  type: object
                  required:
                    - pvcName
                    - suitePath
                    - suiteSHA256
                    - runnerImage
                    - activeDeadlineSeconds
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: execution is immutable
                  properties:
                    pvcName:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    suitePath:
                      type: string
                      minLength: 1
                      maxLength: 512
                      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*(/[A-Za-z0-9][A-Za-z0-9._-]*)*\.toml$
                    suiteSHA256:
                      type: string
                      pattern: ^[a-f0-9]{64}$
                    runnerImage:
                      type: string
                      minLength: 72
                      maxLength: 512
                      pattern: ^[a-z0-9]([a-z0-9._:/-]*[a-z0-9])?@sha256:[a-f0-9]{64}$
                    activeDeadlineSeconds:
                      type: integer
                      format: int64
                      minimum: 30
                      maximum: 1800
                resumeDecisionSHA256:
                  type: string
                  pattern: ^[a-f0-9]{64}$
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                executionSpecSHA256:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                phase:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - AwaitingApproval
                    - Verifying
                    - Succeeded
                    - Blocked
                runID:
                  type: string
                  maxLength: 253
                  pattern: ^[a-f0-9]{32}$
                resumeDecisionSHA256:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                bundleSHA256:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                activeJobRef:
                  type: object
                  required:
                    - name
                    - uid
                    - action
                  properties:
                    name:
                      type: string
                      minLength: 1
                    uid:
                      type: string
                      minLength: 1
                      pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$
                    action:
                      type: string
                      enum:
                        - start
                        - resume
                        - verify
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                        maxLength: 1024
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      reason:
                        type: string
                        maxLength: 1024
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      type:
                        type: string
                        maxLength: 316
      subresources:
        status: {}
