name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile source and validation assets
        run: python -m compileall -q src tests benchmarks examples

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

      - name: Run focused recovery benchmark
        run: python benchmarks/synthetic/run_benchmark.py

      - name: Run pipeline comparison benchmark
        run: python benchmarks/synthetic/run_pipeline_comparison.py

      - name: Build and install package from source
        run: python -m pip install .

      - name: Smoke installed CLI and metadata
        run: |
          python -m pip check
          benchhandoff --help
