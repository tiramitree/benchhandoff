name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile source and validation assets
        run: python -m compileall -q src tests tools benchmarks examples

      - name: Enforce the final license state
        run: python tools/verify_license_state.py --require-final

      - name: Verify external-evidence ledger
        run: python tools/verify_external_evidence.py

      - name: Enforce public privacy gate
        run: python tools/verify_public_privacy.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

  benchmark-evidence:
    name: Canonical synthetic benchmark evidence
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Generate and verify machine-readable benchmark records
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          evidence_parent="$RUNNER_TEMP/benchhandoff-evidence-parent"
          evidence_root="$evidence_parent/package"
          test ! -e "$evidence_parent"
          mkdir "$evidence_parent"
          python benchmarks/synthetic/reproduce.py --output-dir "$evidence_root"
          python benchmarks/synthetic/reproduce.py \
            --verify-dir "$evidence_root" \
            --expected-commit "$GITHUB_SHA"

      - name: Upload benchmark records
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchhandoff-benchmark-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/benchhandoff-evidence-parent/package/
          if-no-files-found: error
          retention-days: 14

  package:
    name: Build once and test exact distribution bytes
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Enforce the explicit license gate
        run: python tools/verify_license_state.py --require-final

      - name: Build and inspect sdist and wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check build==1.5.0 twine==6.2.0
          python -m build
          python -m twine check --strict dist/*
          python tools/verify_public_privacy.py --dist dist
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          sdist="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          wheel_files="$RUNNER_TEMP/benchhandoff-wheel-files.txt"
          sdist_files="$RUNNER_TEMP/benchhandoff-sdist-files.txt"
          unzip -Z1 "$wheel" > "$wheel_files"
          tar -tzf "$sdist" > "$sdist_files"
          grep -Eq '(^|/)licenses/LICENSE$' "$wheel_files"
          grep -Eq '/LICENSE$' "$sdist_files"
          (
            cd dist
            sha256sum * > SHA256SUMS
          )

      - name: Install and smoke the exact wheel outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/benchhandoff-wheel-smoke"
          mkdir -p "$smoke_root"
          wheel="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          python -m venv "$smoke_root/venv"
          "$smoke_root/venv/bin/python" -m pip install --disable-pip-version-check "$wheel"
          (
            cd "$smoke_root"
            "$smoke_root/venv/bin/python" -c 'from importlib.metadata import version; import benchhandoff; assert version("benchhandoff") == benchhandoff.__version__'
            "$smoke_root/venv/bin/benchhandoff" --help
            cp -R "$GITHUB_WORKSPACE/examples/recovery_pipeline" demo
            mkdir runs
            set +e
            PATH="$smoke_root/venv/bin:$PATH" "$smoke_root/venv/bin/benchhandoff" start demo/suite.toml --run-dir runs/recovery
            start_code="$?"
            set -e
            test "$start_code" -eq 20
            PATH="$smoke_root/venv/bin:$PATH" "$smoke_root/venv/bin/benchhandoff" resume runs/recovery
            "$smoke_root/venv/bin/benchhandoff" verify runs/recovery
          )

      - name: Upload the tested distribution bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchhandoff-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
