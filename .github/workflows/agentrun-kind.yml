name: AgentRun real kind E2E

on:
  push:
    paths:
      - ".dockerignore"
      - ".github/workflows/agentrun-kind.yml"
      - "controller/**"
      - "src/benchhandoff/**"
      - "tools/verify_public_privacy.py"
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/agentrun-kind.yml"
      - "controller/**"
      - "src/benchhandoff/**"
      - "tools/verify_public_privacy.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentrun-kind-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  E2E_EVIDENCE_DIR: ${{ runner.temp }}/benchhandoff-agentrun-evidence-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  real-kind:
    name: Pinned single-node two-manager takeover
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Run the pinned real kind gate
        shell: bash
        run: bash controller/test/e2e/run_kind.sh

      - name: Upload the privacy-gated takeover evidence
        if: >-
          github.event_name != 'pull_request' &&
          github.repository == 'tiramitree/benchhandoff'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentrun-takeover-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.E2E_EVIDENCE_DIR }}/takeover-evidence.json
            ${{ env.E2E_EVIDENCE_DIR }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
          include-hidden-files: false
